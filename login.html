<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header>
        <!-- Logo -->
        <picture id="logo" aria-label="Logo do Portal de notícias">
            <img src="img/logo.png" alt="Logo do Portal de notícias">
        </picture>
        <!-- Navbar -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#noticias">Noticias</a></li>
                <li><a href="login.html">Admin</a></li>
            </ul>
        </nav>
        <!-- Form de pesquisa -->
        <form id="search-container" aria-label="Espaço de pesquisa">
            <label for="search">Buscar:</label>
            <input type="search" id="search">
        </form>
    </header>

    <main>
        <form id="login-form">
            <h1>Login</h1>
            <label for="email">Email: </label>
            <input type="email" id="email">

            <label for="password">Senha: </label>
            <input type="password" id="senha">

            <button aria-label="Botão de Enviar" type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <div>
            <p>
                todos os direitos reservados
            </p>
        </div>
        <div>
            <ul>
                <li><a aria-label="Contato" href="#">Contato</a></li>
                <li><a aria-label="Trabalhe Conosco" href="#">Trabalhe Conosco</a></li>
            </ul>
        </div>
    </footer>

</body>

</html>
